<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuziGenius (句子Genius)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Hanzi Writer CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Prompt Zone -->
        <div id="english-prompt">Initializing session...</div>

        <!-- Assembly Line (Slots) -->
        <div id="assembly-line"></div>

        <!-- Main Workspace Area: Left Sidebar Buttons + Central InkStone Canvas -->
        <div id="workspace-main">
            <!-- Action Sidebar (Vertical on the left) -->
            <div id="action-sidebar">
                <button id="btn-clear" class="action-btn">Clear</button>
                <button id="btn-hint" class="action-btn">Hint</button>
                <button id="btn-submit" class="action-btn">Submit</button>
                <button id="btn-discuss" class="action-btn">Discuss</button>
            </div>

            <!-- InkStone Canvas Container Wrapper -->
            <div id="canvas-wrapper">
		<!-- Reserved space for hints to avoid layout shift -->
                <div id="hint-display-container"></div>
                <div id="tian-zi-ge"></div>

                <!-- Punctuation Toolbelt (Small & Subtle underneath the canvas) -->
                <div id="punctuation-toolbelt">
                    <button class="punc-btn" data-punc="，">，</button>
                    <button class="punc-btn" data-punc="。">。</button>
                    <button class="punc-btn" data-punc="！">！</button>
                    <button class="punc-btn" data-punc="？">？</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Controller Logic -->
    <script src="app.js"></script>
</body>
</html>
