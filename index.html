<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuziGenius (句子Genius)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Hanzi Writer CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Top Bar: Import (Left), Mascot Counter (Center), Discuss (Right) -->
        <header id="top-bar">
            <button id="btn-import" class="top-btn" title="Import Chinese Text">Import</button>
            
            <div id="character-counter" title="Total unique characters unlocked in your database">
                <img src="mascot.png" alt="Juzi Mascot" class="mascot-avatar-small" />
                <span>Unlocked: <strong id="counter-value">0</strong></span>
            </div>

            <button id="btn-discuss" class="top-btn" title="Discuss & Grammar Breakdown">Discuss</button>
        </header>

        <!-- Prompt Zone -->
        <div id="english-prompt">Initializing session...</div>

        <!-- Assembly Line (Slots) -->
        <div id="assembly-line"></div>

        <!-- Main Workspace Area: Sidebar (Clear, Hint) + Central Canvas -->
        <div id="workspace-main">
            <!-- Action Sidebar (Vertical on the left) -->
            <div id="action-sidebar">
                <button id="btn-clear" class="action-btn">Clear</button>
                <button id="btn-hint" class="action-btn">Hint</button>
            </div>

            <!-- InkStone Canvas Container Wrapper -->
            <div id="canvas-wrapper">
                <!-- Reserved space for hints to avoid layout shift -->
                <div id="hint-display-container"></div>
                <div id="tian-zi-ge"></div>
            </div>
        </div>
    </div>

    <!-- Bulk Import Modal Overlay -->
    <div id="import-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">Import Chinese Text</h2>
            <p class="modal-subtitle">Paste Chinese sentences, stories, or vocabulary below to unlock characters and discover words.</p>
            <textarea id="import-textarea" placeholder="例如：我喜欢在每天早上喝热茶。"></textarea>
            <div class="modal-actions">
                <button id="modal-btn-cancel" class="modal-btn btn-secondary">Cancel</button>
                <button id="modal-btn-submit" class="modal-btn btn-primary">Process & Unlock</button>
            </div>
        </div>
    </div>

    <!-- Main Controller Logic -->
    <script src="app.js"></script>
</body>
</html>
